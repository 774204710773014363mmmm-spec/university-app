name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # تخزين مؤقت: SDK لا يُنزّل من جديد في كل بناء
      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}
            ~/.android
          key: android-sdk-v1

      # تخزين مؤقت: Gradle dependencies + build cache (أكبر تسريع)
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
          cache-read-only: false

      - name: Build APK
        run: |
          gradle assembleDebug --no-daemon --build-cache

      - name: Publish APK to repo
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ./تطبيق_الجامعه.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ./تطبيق_الجامعه.apk
          git commit -m "APK update" || true
          git push origin HEAD:main